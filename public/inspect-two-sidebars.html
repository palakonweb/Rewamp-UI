<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inspect Sidebars Videos</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; margin-bottom: 30px; }
    .card { background: #222; padding: 8px; border-radius: 6px; text-align: center; }
    canvas { width: 100%; border-radius: 4px; }
    video { max-width: 500px; display: inline-block; margin-right: 20px; }
  </style>
</head>
<body>
  <h2>Video 1: Recording 2026-09-15 155640.mp4</h2>
  <video id="vid1" controls src="/Recording%202026-09-15%20155640.mp4"></video>
  <div id="output1" class="grid"></div>

  <h2>Video 2: Recording 2026-09-15 204056.mp4 (turns on click)</h2>
  <video id="vid2" controls src="/Recording%202026-09-15%20204056.mp4"></video>
  <div id="output2" class="grid"></div>

  <script>
    async function inspectVid(vidId, outId, maxDuration = 4.0) {
      const vid = document.getElementById(vidId);
      const out = document.getElementById(outId);

      await new Promise((res) => {
        if (vid.readyState >= 1) res();
        else vid.onloadedmetadata = () => res();
      });

      const step = 0.3;
      for (let t = 0; t <= Math.min(vid.duration, maxDuration); t += step) {
        await new Promise((resolve) => {
          vid.currentTime = t;
          vid.onseeked = () => {
            const card = document.createElement('div');
            card.className = 'card';
            const title = document.createElement('div');
            title.textContent = `T: ${t.toFixed(2)}s`;
            const canvas = document.createElement('canvas');
            canvas.width = vid.videoWidth;
            canvas.height = vid.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(vid, 0, 0);
            card.appendChild(title);
            card.appendChild(canvas);
            out.appendChild(card);
            resolve();
          };
        });
      }
    }

    window.onload = async () => {
      await inspectVid('vid1', 'output1', 4.0);
      await inspectVid('vid2', 'output2', 4.0);
    };
  </script>
</body>
</html>
