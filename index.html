<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logos/logo.svg" />
  <link rel="apple-touch-icon" href="/logos/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>RewampUI - Component Showcase Dashboard</title>

  <!-- Brand typeface is SF Pro (see src/Agent.md). SF Pro is an Apple system
       font and is not distributable via Google Fonts/CDN, so it cannot be
       webfont-loaded here — flagging per Agent.md's enforcement note. It is
       picked up automatically via -apple-system on Mac/iOS/Safari; other
       platforms fall through to the documented fallback stack only
       (no Inter or other typefaces mixed in, per Agent.md). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Geist+Mono:wght@300;400;500&display=swap"
  />
</head>

<body>
  <script>
    // Apply the persisted theme before first paint so a fresh load/navigation
    // never flashes light mode (or renders dark-mode components against
    // light CSS variables) while React is still hydrating. Kept in sync with
    // the logic in src/lib/siteTheme.js — same storage key, same attribute.
    (function () {
      try {
        var stored = localStorage.getItem('rewamp-theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored);
          document.documentElement.classList.toggle('dark', stored === 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
